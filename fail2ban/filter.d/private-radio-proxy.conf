# fail2ban filter for private-radio-proxy
# Matches structured lines written to logs/app.log:
#   ... AUTH_FAIL ip=1.2.3.4 reason=invalid_or_expired_token path=...
#   ... RATE_LIMITED ip=1.2.3.4 scope=auth path=...
#   ... RATE_LIMITED ip=1.2.3.4 scope=stream station=...
#   ... RATE_LIMITED ip=1.2.3.4 scope=requests path=...

[Definition]
failregex = ^.*\bAUTH_FAIL ip=<HOST>\b.*$
            ^.*\bRATE_LIMITED ip=<HOST>\b.*$
ignoreregex =
