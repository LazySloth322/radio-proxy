# fail2ban jail for private-radio-proxy
# Adjust APP_PORT to the value from config/app.json (server.port).
# Debian 12/13 ship fail2ban 1.0.x - if your version uses nftables by
# default, 'banaction = nftables-multiport' also works.

[private-radio-proxy]
enabled  = true
filter   = private-radio-proxy
logpath  = /opt/private-radio-proxy/logs/app.log
backend  = auto
maxretry = 20
findtime = 60
bantime  = 3600
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 1w
banaction = iptables-multiport[port="54391", protocol=tcp]
